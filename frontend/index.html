<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json?v=voice-playback-fallback" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Jarvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=voice-playback-fallback" />
</head>
<body class="auth-pending">

  <div class="shell-login" id="shellLogin">
    <div class="shell-login-card">
      <div class="shell-login-brand">
        <span class="shell-login-mark">▲</span>
        <span class="shell-login-name">JARVIS</span>
      </div>
      <div class="shell-login-sub">Sign in to continue.</div>
      <form class="shell-login-form" id="shellLoginForm">
        <input
          type="password"
          id="shellPasswordInput"
          placeholder="password"
          autocomplete="current-password"
          inputmode="numeric"
        />
        <button type="submit" class="shell-login-button">Sign in</button>
      </form>
      <div class="shell-login-error" id="shellLoginError"></div>
    </div>
  </div>

  <div id="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark">▲</span>
        <span class="brand-name">JARVIS</span>
      </div>
      <button class="top-logout-button" id="topLogoutButton">log out</button>
    </header>

    <main class="stage">
      <div class="chat-app" id="chatApp">
        <aside class="chat-sidebar" id="chatSidebar">
          <div class="chat-sidebar-header">
            <button class="chat-new-button" id="chatNewButton">+ New Chat</button>
          </div>
          <div class="chat-list" id="chatList"></div>
          <div class="chat-sidebar-footer">
            <button class="chat-logout-button" id="chatLogoutButton">log out</button>
          </div>
        </aside>

        <div class="chat-main">
          <div class="chat-main-header">
            <button class="chat-hamburger" id="chatHamburger" aria-label="Toggle sidebar">
              <span></span><span></span><span></span>
            </button>
            <div class="chat-title" id="chatTitle">No chat selected</div>
            <button class="chat-settings-button" id="chatSettingsButton" aria-label="Chat settings" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.08A1.7 1.7 0 0 0 8.96 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.04A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.03 4.2l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.04a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c0 .67.39 1.28 1 1.56H21a2 2 0 1 1 0 4h-.04A1.7 1.7 0 0 0 19.4 15Z"></path>
              </svg>
            </button>
            <div class="chat-settings-panel" id="chatSettingsPanel" hidden>
              <label class="chat-setting-label" for="voiceSpeedSlider">
                <span>Voice playback speed</span>
                <output id="voiceSpeedValue">1.0x</output>
              </label>
              <input id="voiceSpeedSlider" class="chat-speed-slider" type="range" min="0.75" max="2" step="0.05" value="1" />
              <button class="chat-settings-logout" id="chatSettingsLogoutButton">log out</button>
            </div>
          </div>

          <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">Pick a chat or start a new one.</div>
          </div>

          <div class="chat-composer">
            <textarea
              id="chatInput"
              placeholder="Message Jarvis…"
              rows="1"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
            ></textarea>
            <button class="chat-mic-button" id="chatMicButton" aria-label="Tap to record">
              <svg class="chat-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
                <path d="M5 11a7 7 0 0 0 14 0"></path>
                <path d="M12 18v3"></path>
                <path d="M8 21h8"></path>
              </svg>
              <span class="chat-mic-waveform" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
              <span class="chat-mic-spinner" aria-hidden="true"></span>
            </button>
            <button class="chat-send-button" id="chatSendButton">send</button>
            <div class="chat-mic-status" id="chatMicStatus" aria-live="polite"></div>
          </div>
        </div>

        <div class="chat-sidebar-backdrop" id="chatSidebarBackdrop"></div>
      </div>
    </main>
  </div>

  <script src="/app.js?v=voice-playback-fallback"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
